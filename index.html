<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebChat mit Lobbys</title>
    <!-- iOS Vollbild-Modus Meta-Tags für iPad & iPhone -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="WebChat">
    <style>
        :root {
            --glow-color: #0b57d0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #131314;
            color: #e3e3e3;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .chat-container {
            position: relative;
            width: 100%;
            max-width: 550px;
            background-color: #1e1f20;
            border: 1px solid #333537;
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
            transition: box-shadow 0.4s ease, border-color 0.4s ease;
        }

        /* Glow-Effekt für den Rand */
        .chat-container.glow-active {
            box-shadow: 0 0 25px 2px var(--glow-color), 0 0 50px -5px var(--glow-color);
            border-color: var(--glow-color);
        }

        .app-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .app-header h2 {
            margin-bottom: 0;
        }

        .icon-btn {
            background: transparent;
            border: none;
            color: #c4c7c5;
            font-size: 1.3rem;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 50%;
            transition: background-color 0.2s ease, color 0.2s ease;
        }

        .icon-btn:hover {
            background-color: #282a2c;
            color: #ffffff;
        }

        /* Einstellungen Modal / Popover */
        .settings-modal {
            display: none;
            position: absolute;
            top: 60px;
            right: 24px;
            background-color: #282a2c;
            border: 1px solid #444746;
            border-radius: 12px;
            padding: 16px;
            width: 220px;
            z-index: 100;
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.5);
        }

        .settings-modal.open {
            display: block;
        }

        .settings-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            font-size: 0.9rem;
        }

        .settings-row:last-child {
            margin-bottom: 0;
        }

        .color-picker {
            -webkit-appearance: none;
            -moz-appearance: none;
            appearance: none;
            width: 32px;
            height: 32px;
            border: none;
            border-radius: 50%;
            cursor: pointer;
            background: transparent;
        }

        .color-picker::-webkit-color-swatch-wrapper {
            padding: 0;
        }

        .color-picker::-webkit-color-swatch {
            border: 2px solid #444746;
            border-radius: 50%;
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 40px;
            height: 22px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #444746;
            transition: .3s;
            border-radius: 22px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 16px;
            width: 16px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .3s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background-color: #0b57d0;
        }

        input:checked + .slider:before {
            transform: translateX(18px);
        }

        h2, h3 {
            text-align: center;
            font-weight: 500;
            color: #f1f3f4;
            margin-bottom: 16px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 16px;
        }

        input[type="text"], input[type="email"], input[type="password"] {
            width: 100%;
            padding: 14px 16px;
            background-color: #282a2c;
            border: 1px solid #444746;
            border-radius: 8px;
            color: #ffffff;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s ease;
        }

        input:focus {
            border-color: #a8c7fa;
        }

        input::placeholder {
            color: #8e918f;
        }

        button {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: none;
            background-color: #0b57d0;
            color: #ffffff;
            font-size: 0.95rem;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        button:hover {
            background-color: #1b66c9;
        }

        .secondary-btn {
            background-color: transparent;
            color: #a8c7fa;
            border: 1px solid #444746;
        }

        .secondary-btn:hover {
            background-color: #282a2c;
        }

        .delete-btn {
            background-color: #a50e0e;
            color: white;
            padding: 8px 12px;
            font-size: 0.8rem;
        }

        .delete-btn:hover {
            background-color: #b3261e;
        }

        .toggle-text {
            text-align: center;
            margin-top: 14px;
            font-size: 0.85rem;
            color: #c4c7c5;
        }

        .toggle-link {
            color: #a8c7fa;
            cursor: pointer;
            text-decoration: underline;
        }

        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #282a2c;
            padding: 10px 14px;
            border-radius: 8px;
            margin-bottom: 16px;
            font-size: 0.9rem;
            color: #c4c7c5;
        }

        .header-bar span {
            color: #a8c7fa;
            font-weight: 500;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .help-btn {
            background: transparent;
            border: 1px solid #444746;
            color: #8e918f;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            font-size: 0.8rem;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            padding: 0;
            transition: all 0.2s ease;
        }

        .help-btn:hover {
            background-color: #333537;
            color: #ffffff;
            border-color: #a8c7fa;
        }

        .lobby-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 250px;
            overflow-y: auto;
            margin-bottom: 20px;
        }

        .lobby-card {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #282a2c;
            padding: 14px;
            border-radius: 8px;
            border: 1px solid #444746;
        }

        .lobby-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .lobby-buttons {
            display: flex;
            gap: 8px;
        }

        .badge {
            background-color: #ff4d4d;
            color: white;
            font-size: 0.75rem;
            font-weight: bold;
            padding: 2px 8px;
            border-radius: 12px;
        }

        .lobby-card button {
            width: auto;
            padding: 8px 16px;
        }

        #messages {
            height: 350px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding-right: 6px;
            margin-bottom: 16px;
        }

        .message {
            background-color: #282a2c;
            padding: 10px 14px;
            border-radius: 12px;
            max-width: 85%;
            word-wrap: break-word;
            align-self: flex-start;
            border-bottom-left-radius: 2px;
        }

        .message.own {
            align-self: flex-end;
            background-color: #004a77;
            border-bottom-left-radius: 12px;
            border-bottom-right-radius: 2px;
        }

        .message .username {
            font-size: 0.75rem;
            color: #a8c7fa;
            margin-bottom: 4px;
            display: block;
        }

        .chat-controls {
            display: flex;
            gap: 10px;
        }

        .chat-controls input {
            margin: 0;
        }

        .chat-controls button {
            width: auto;
            padding: 0 20px;
        }

        #auth-section, #lobby-section, #chat-section, #admin-create-lobby {
            display: none;
        }
    </style>
</head>
<body>

<div class="chat-container" id="main-container">
    <div class="app-header">
        <h2>WebChat</h2>
        <button id="btn-toggle-settings" class="icon-btn" title="Einstellungen">⚙️</button>
    </div>

    <!-- EINSTELLUNGEN POPUP -->
    <div id="settings-modal" class="settings-modal">
        <div class="settings-row">
            <span>Glow-Effekt</span>
            <label class="switch">
                <input type="checkbox" id="glow-toggle">
                <span class="slider"></span>
            </label>
        </div>
        <div class="settings-row">
            <span>Glow-Farbe</span>
            <input type="color" id="glow-color-picker" class="color-picker" value="#0b57d0">
        </div>
    </div>

    <!-- AUTHENTIFIZIERUNG -->
    <div id="auth-section">
        <div class="input-group">
            <input type="text" id="username" placeholder="Benutzername (Chat-Name)">
            <input type="email" id="email" placeholder="E-Mail-Adresse">
            <input type="password" id="password" placeholder="Passwort (mind. 6 Zeichen)">
        </div>
        <button id="btn-auth">Einloggen</button>
        <div class="toggle-text">
            <span id="toggle-prompt">Noch kein Konto?</span> 
            <span id="toggle-action" class="toggle-link">Jetzt registrieren</span>
        </div>
    </div>

    <!-- LOBBY AUSWAHL -->
    <div id="lobby-section">
        <div class="header-bar">
            <div>Angemeldet als: <span id="user-display"></span></div>
            <div class="header-actions">
                <button id="btn-show-uid" class="help-btn" title="Eigene UID anzeigen">?</button>
                <button id="btn-logout" class="secondary-btn" style="width: auto; padding: 4px 10px; margin: 0; font-size: 0.8rem;">Abmelden</button>
            </div>
        </div>

        <h3>Verfügbare Lobbys</h3>
        <div id="lobby-list" class="lobby-list"></div>

        <div id="admin-create-lobby" style="margin-top: 20px; border-top: 1px solid #444746; padding-top: 16px;">
            <h3>Neue Lobby erstellen (Admin)</h3>
            <div class="input-group">
                <input type="text" id="new-lobby-name" placeholder="Lobby Name">
                <input type="password" id="new-lobby-password" placeholder="Lobby Passwort">
            </div>
            <button id="btn-create-lobby">Lobby Erstellen</button>
        </div>
    </div>

    <!-- CHAT BEREICH -->
    <div id="chat-section">
        <div class="header-bar">
            <div>Lobby: <span id="current-lobby-display"></span></div>
            <button id="btn-leave-lobby" class="secondary-btn" style="width: auto; padding: 4px 10px; margin: 0; font-size: 0.8rem;">Lobby verlassen</button>
        </div>
        
        <div id="messages"></div>

        <div class="chat-controls">
            <input type="text" id="message-input" placeholder="Nachricht schreiben...">
            <button id="btn-send">Senden</button>
        </div>
    </div>
</div>

<!-- FIREBASE SKRIPT -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { 
        getAuth, 
        createUserWithEmailAndPassword, 
        signInWithEmailAndPassword, 
        updateProfile,
        onAuthStateChanged, 
        signOut 
    } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { 
        getFirestore, 
        collection, 
        addDoc, 
        doc,
        getDoc,
        setDoc,
        deleteDoc,
        query, 
        orderBy, 
        onSnapshot, 
        serverTimestamp 
    } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
    import { 
        getMessaging, 
        getToken, 
        onMessage 
    } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-messaging.js";

    const ADMIN_UID = "839EC6PcMoMLwWly7nMzGPe91wk1"; 

    const firebaseConfig = {
      apiKey: "AIzaSyD5funl7uYInXXMBGpqmjp0O7c0tqhBNw0",
      authDomain: "webchat-1c480.firebaseapp.com",
      projectId: "webchat-1c480",
      storageBucket: "webchat-1c480.firebasestorage.app",
      messagingSenderId: "149320504905",
      appId: "1:149320504905:web:501f24bdf3846d32b15198",
      measurementId: "G-LN66CN39SJ"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const messaging = getMessaging(app);

    let isRegisterMode = false;
    let currentLobbyId = null;
    let unsubscribeMessages = null;
    let isAdmin = false;
    let isInitialLoad = true;

    // --- GLOW EINSTELLUNGEN LOGIK ---
    const mainContainer = document.getElementById('main-container');
    const settingsModal = document.getElementById('settings-modal');
    const btnToggleSettings = document.getElementById('btn-toggle-settings');
    const glowToggle = document.getElementById('glow-toggle');
    const glowColorPicker = document.getElementById('glow-color-picker');

    const savedGlowEnabled = localStorage.getItem('glowEnabled') === 'true';
    const savedGlowColor = localStorage.getItem('glowColor') || '#0b57d0';

    glowToggle.checked = savedGlowEnabled;
    glowColorPicker.value = savedGlowColor;
    document.documentElement.style.setProperty('--glow-color', savedGlowColor);
    if (savedGlowEnabled) mainContainer.classList.add('glow-active');

    btnToggleSettings.addEventListener('click', (e) => {
        e.stopPropagation();
        settingsModal.classList.toggle('open');
    });

    document.addEventListener('click', (e) => {
        if (!settingsModal.contains(e.target) && e.target !== btnToggleSettings) {
            settingsModal.classList.remove('open');
        }
    });

    glowToggle.addEventListener('change', (e) => {
        const isEnabled = e.target.checked;
        localStorage.setItem('glowEnabled', isEnabled);
        if (isEnabled) {
            mainContainer.classList.add('glow-active');
        } else {
            mainContainer.classList.remove('glow-active');
        }
    });

    glowColorPicker.addEventListener('input', (e) => {
        const color = e.target.value;
        document.documentElement.style.setProperty('--glow-color', color);
        localStorage.setItem('glowColor', color);
    });

    // --- FIREBASE LOGIK ---
    async function requestNotificationPermission(user) {
        if ('serviceWorker' in navigator && 'Notification' in window) {
            try {
                const permission = await Notification.requestPermission();
                if (permission === 'granted') {
                    const registration = await navigator.serviceWorker.register('/firebase-messaging-sw.js');
                    const token = await getToken(messaging, { serviceWorkerRegistration: registration });
                    
                    if (token) {
                        await setDoc(doc(db, "users", user.uid), {
                            pushToken: token,
                            username: user.displayName || user.email
                        }, { merge: true });
                    }
                }
            } catch (error) {
                console.log("Benachrichtigungs-Einrichtung abgebrochen/fehlgeschlagen:", error);
            }
        }
    }

    onMessage(messaging, (payload) => {
        new Notification(payload.notification.title, {
            body: payload.notification.body
        });
    });

    function getSavedLobbies() {
        return JSON.parse(localStorage.getItem("savedLobbies") || "{}");
    }

    function saveLobbyAccess(lobbyId, password) {
        const saved = getSavedLobbies();
        saved[lobbyId] = password;
        localStorage.setItem("savedLobbies", JSON.stringify(saved));
    }

    const authSection = document.getElementById('auth-section');
    const lobbySection = document.getElementById('lobby-section');
    const chatSection = document.getElementById('chat-section');
    const usernameInput = document.getElementById('username');
    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password');
    const btnAuth = document.getElementById('btn-auth');
    const togglePrompt = document.getElementById('toggle-prompt');
    const toggleAction = document.getElementById('toggle-action');
    const userDisplay = document.getElementById('user-display');
    const adminCreateLobby = document.getElementById('admin-create-lobby');
    const lobbyListDiv = document.getElementById('lobby-list');
    const currentLobbyDisplay = document.getElementById('current-lobby-display');
    const messagesDiv = document.getElementById('messages');
    const messageInput = document.getElementById('message-input');

    usernameInput.style.display = "none";

    toggleAction.addEventListener('click', () => {
        isRegisterMode = !isRegisterMode;
        if (isRegisterMode) {
            usernameInput.style.display = "block";
            btnAuth.textContent = "Konto erstellen";
            togglePrompt.textContent = "Bereits ein Konto?";
            toggleAction.textContent = "Hier einloggen";
        } else {
            usernameInput.style.display = "none";
            btnAuth.textContent = "Einloggen";
            togglePrompt.textContent = "Noch kein Konto?";
            toggleAction.textContent = "Jetzt registrieren";
        }
    });

    btnAuth.addEventListener('click', () => {
        const email = emailInput.value.trim();
        const password = passwordInput.value;
        const username = usernameInput.value.trim();

        if (!email || !password) return alert("Bitte E-Mail und Passwort eingeben!");

        if (isRegisterMode) {
            if (!username) return alert("Bitte Benutzernamen eingeben!");
            createUserWithEmailAndPassword(auth, email, password)
                .then((res) => updateProfile(res.user, { displayName: username }))
                .catch((err) => alert("Fehler: " + err.message));
        } else {
            signInWithEmailAndPassword(auth, email, password)
                .catch((err) => alert("Login fehlgeschlagen: " + err.message));
        }
    });

    document.getElementById('btn-logout').addEventListener('click', () => {
        localStorage.removeItem("autoSavedLobbyId");
        signOut(auth);
    });

    document.getElementById('btn-show-uid').addEventListener('click', () => {
        if (auth.currentUser) {
            const uid = auth.currentUser.uid;
            navigator.clipboard.writeText(uid);
            alert("Deine User-ID (UID):\n\n" + uid + "\n\n(Die UID wurde auch in deine Zwischenablage kopiert!)");
        }
    });

    onAuthStateChanged(auth, async (user) => {
        if (user) {
            authSection.style.display = "none";
            userDisplay.textContent = user.displayName || user.email;

            isAdmin = (user.uid === ADMIN_UID);
            if (isAdmin) {
                adminCreateLobby.style.display = "block";
            } else {
                adminCreateLobby.style.display = "none";
            }

            requestNotificationPermission(user);

            const savedLobbyId = localStorage.getItem("autoSavedLobbyId");
            if (savedLobbyId) {
                const lobbyDoc = await getDoc(doc(db, "lobbies", savedLobbyId));
                if (lobbyDoc.exists()) {
                    autoReconnectToLobby(savedLobbyId, lobbyDoc.data().name);
                    return;
                } else {
                    localStorage.removeItem("autoSavedLobbyId");
                }
            }

            lobbySection.style.display = "block";
            chatSection.style.display = "none";
            loadLobbies();
        } else {
            authSection.style.display = "block";
            lobbySection.style.display = "none";
            chatSection.style.display = "none";
        }
    });

    function autoReconnectToLobby(lobbyId, name) {
        currentLobbyId = lobbyId;
        currentLobbyDisplay.textContent = name;

        lobbySection.style.display = "none";
        chatSection.style.display = "block";

        loadMessages(lobbyId);
    }

    document.getElementById('btn-create-lobby').addEventListener('click', async () => {
        const name = document.getElementById('new-lobby-name').value.trim();
        const password = document.getElementById('new-lobby-password').value.trim();

        if (!name || !password) return alert("Bitte Name und Passwort für die Lobby eingeben!");

        try {
            await addDoc(collection(db, "lobbies"), {
                name: name,
                password: password,
                lastMessageTime: serverTimestamp()
            });
            document.getElementById('new-lobby-name').value = "";
            document.getElementById('new-lobby-password').value = "";
            alert("Lobby erfolgreich erstellt!");
        } catch (e) {
            alert("Fehler beim Erstellen: " + e.message);
        }
    });

    function loadLobbies() {
        onSnapshot(collection(db, "lobbies"), (snapshot) => {
            lobbyListDiv.innerHTML = "";
            snapshot.forEach((docSnap) => {
                const lobby = docSnap.data();
                const lobbyId = docSnap.id;

                const card = document.createElement('div');
                card.className = 'lobby-card';

                const lastSeen = localStorage.getItem(`lastSeen_${lobbyId}`) || 0;
                const lastMsg = lobby.lastMessageTime ? lobby.lastMessageTime.toMillis() : 0;
                const hasUnread = lastMsg > lastSeen;

                let deleteBtnHtml = isAdmin ? `<button class="delete-btn" data-id="${lobbyId}">Löschen</button>` : '';

                card.innerHTML = `
                    <div class="lobby-info">
                        <strong>${escapeHtml(lobby.name)}</strong>
                        ${hasUnread ? '<span class="badge">Neu!</span>' : ''}
                    </div>
                    <div class="lobby-buttons">
                        <button class="join-btn">Beitreten</button>
                        ${deleteBtnHtml}
                    </div>
                `;

                card.querySelector('.join-btn').addEventListener('click', () => joinLobby(lobbyId, lobby.name, lobby.password));

                if (isAdmin) {
                    card.querySelector('.delete-btn').addEventListener('click', () => deleteLobby(lobbyId, lobby.name));
                }

                lobbyListDiv.appendChild(card);
            });
        });
    }

    async function deleteLobby(lobbyId, name) {
        if (confirm(`Möchtest du die Lobby "${name}" wirklich unwiderruflich löschen?`)) {
            try {
                await deleteDoc(doc(db, "lobbies", lobbyId));
                alert("Lobby gelöscht.");
            } catch (e) {
                alert("Fehler beim Löschen: " + e.message);
            }
        }
    }

    function joinLobby(lobbyId, name, correctPassword) {
        const savedLobbies = getSavedLobbies();

        if (savedLobbies[lobbyId] === correctPassword) {
            localStorage.setItem("autoSavedLobbyId", lobbyId);
            localStorage.setItem(`lastSeen_${lobbyId}`, Date.now());
            autoReconnectToLobby(lobbyId, name);
            return;
        }

        const enteredPassword = prompt(`Passwort für Lobby "${name}" eingeben:`);
        if (enteredPassword === correctPassword) {
            saveLobbyAccess(lobbyId, correctPassword);
            localStorage.setItem("autoSavedLobbyId", lobbyId);
            localStorage.setItem(`lastSeen_${lobbyId}`, Date.now());

            autoReconnectToLobby(lobbyId, name);
        } else if (enteredPassword !== null) {
            alert("Falsches Passwort!");
        }
    }

    document.getElementById('btn-leave-lobby').addEventListener('click', () => {
        if (unsubscribeMessages) unsubscribeMessages();
        
        localStorage.removeItem("autoSavedLobbyId");

        if (currentLobbyId) {
            localStorage.setItem(`lastSeen_${currentLobbyId}`, Date.now());
        }
        
        currentLobbyId = null;
        chatSection.style.display = "none";
        lobbySection.style.display = "block";
        loadLobbies();
    });

    document.getElementById('btn-send').addEventListener('click', sendMessage);
    messageInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') sendMessage();
    });

    async function sendMessage() {
        const text = messageInput.value.trim();
        if (text !== "" && auth.currentUser && currentLobbyId) {
            try {
                const now = serverTimestamp();

                await addDoc(collection(db, "lobbies", currentLobbyId, "messages"), {
                    text: text,
                    user: auth.currentUser.displayName || auth.currentUser.email,
                    uid: auth.currentUser.uid,
                    timestamp: now
                });

                await setDoc(doc(db, "lobbies", currentLobbyId), {
                    lastMessageTime: now
                }, { merge: true });

                messageInput.value = "";
                localStorage.setItem(`lastSeen_${currentLobbyId}`, Date.now());
            } catch (e) {
                alert("Fehler beim Senden: " + e.message);
            }
        }
    }

    function loadMessages(lobbyId) {
        isInitialLoad = true;
        const q = query(collection(db, "lobbies", lobbyId, "messages"), orderBy("timestamp", "asc"));
        
        unsubscribeMessages = onSnapshot(q, (snapshot) => {
            messagesDiv.innerHTML = "";
            snapshot.forEach((docSnap) => {
                const data = docSnap.data();
                const isOwn = auth.currentUser && data.uid === auth.currentUser.uid;
                
                const msgEl = document.createElement('div');
                msgEl.className = `message ${isOwn ? 'own' : ''}`;
                msgEl.innerHTML = `
                    <span class="username">${escapeHtml(data.user)}</span>
                    <div class="text">${escapeHtml(data.text)}</div>
                `;
                messagesDiv.appendChild(msgEl);

                if (!isInitialLoad && !isOwn && document.hidden && Notification.permission === "granted") {
                    new Notification(`Neue Nachricht von ${data.user}`, {
                        body: data.text
                    });
                }
            });

            isInitialLoad = false;
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        });
    }

    function escapeHtml(str) {
        return str ? str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;") : "";
    }
</script>
