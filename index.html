<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mein GitHub Chat</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 500px; margin: 30px auto; padding: 20px; border: 1px solid #ddd; border-radius: 8px; }
        .hidden { display: none; }
        #chat-box { height: 300px; border: 1px solid #ccc; overflow-y: scroll; padding: 10px; margin-bottom: 10px; border-radius: 4px; background: #f9f9f9; }
        .message { margin-bottom: 8px; background: #fff; padding: 6px 10px; border-radius: 4px; border: 1px solid #eee; }
        .sender { font-weight: bold; color: #007bff; }
        input, button { padding: 10px; margin: 5px 0; width: 100%; box-sizing: border-box; border-radius: 4px; border: 1px solid #ccc; }
        button { background-color: #28a745; color: white; border: none; font-weight: bold; cursor: pointer; }
        button:hover { background-color: #218838; }
        #btn-register { background-color: #007bff; }
        #btn-register:hover { background-color: #0056b3; }
    </style>
</head>
<body>

    <!-- 1. ANMELDUNG / REGISTRIERUNG -->
    <div id="auth-container">
        <h2>Willkommen im Chat</h2>
        <p>Bitte erstelle ein Konto oder logge dich ein:</p>
        <input type="email" id="email" placeholder="E-Mail Adresse">
        <input type="password" id="password" placeholder="Passwort (mind. 6 Zeichen)">
        <button id="btn-login">Einloggen</button>
        <button id="btn-register">Registrieren</button>
        <p id="auth-error" style="color: red; font-size: 14px;"></p>
    </div>

    <!-- 2. CHAT FENSTER -->
    <div id="chat-container" class="hidden">
        <h2>Chatraum</h2>
        <p>Eingeloggt als: <strong id="user-display"></strong> 
           <button id="btn-logout" style="width: auto; background-color: #dc3545; padding: 5px 10px; margin-left: 10px;">Abmelden</button>
        </p>
        
        <div id="chat-box"></div>

        <input type="text" id="message-input" placeholder="Nachricht schreiben...">
        <button id="btn-send">Senden</button>
    </div>

    <!-- Firebase Skripte einbinden -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { 
            getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged 
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { 
            getFirestore, collection, addDoc, query, orderBy, onSnapshot, serverTimestamp 
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // ⚠️ HIER DEINE EIGENE FIREBASE-KONFIGURATION EINSETZEN:
        const firebaseConfig = {
           apiKey: "AIzaSyD5funl7uYInXXMBGpqmjp0O7c0tqhBNw0",
  authDomain: "webchat-1c480.firebaseapp.com",
  projectId: "webchat-1c480",
  storageBucket: "webchat-1c480.firebasestorage.app",
  messagingSenderId: "149320504905",
  appId: "1:149320504905:web:501f24bdf3846d32b15198",
  measurementId: "G-LN66CN39SJ"
        };

        // Firebase starten
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // HTML Elemente
        const authContainer = document.getElementById('auth-container');
        const chatContainer = document.getElementById('chat-container');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const authError = document.getElementById('auth-error');
        const userDisplay = document.getElementById('user-display');
        const chatBox = document.getElementById('chat-box');
        const messageInput = document.getElementById('message-input');

        // REGISTRIEREN
        document.getElementById('btn-register').addEventListener('click', () => {
            authError.textContent = "";
            createUserWithEmailAndPassword(auth, emailInput.value, passwordInput.value)
                .catch(error => authError.textContent = error.message);
        });

        // EINLOGGEN
        document.getElementById('btn-login').addEventListener('click', () => {
            authError.textContent = "";
            signInWithEmailAndPassword(auth, emailInput.value, passwordInput.value)
                .catch(error => authError.textContent = error.message);
        });

        // AUSLOGGEN
        document.getElementById('btn-logout').addEventListener('click', () => {
            signOut(auth);
        });

        // PRÜFEN, OB JEMAND EINGELOGGT IST
        onAuthStateChanged(auth, user => {
            if (user) {
                authContainer.classList.add('hidden');
                chatContainer.classList.remove('hidden');
                userDisplay.textContent = user.email;
                loadMessages();
            } else {
                authContainer.classList.remove('hidden');
                chatContainer.classList.add('hidden');
            }
        });

        // NACHRICHT SENDEN
        document.getElementById('btn-send').addEventListener('click', async () => {
            const text = messageInput.value.trim();
            if (text !== '') {
                await addDoc(collection(db, "messages"), {
                    text: text,
                    sender: auth.currentUser.email,
                    createdAt: serverTimestamp()
                });
                messageInput.value = '';
            }
        });

        // NACHRICHTEN ECHTZEIT-SYNCHRONISATION
        function loadMessages() {
            const q = query(collection(db, "messages"), orderBy("createdAt", "asc"));
            onSnapshot(q, (snapshot) => {
                chatBox.innerHTML = '';
                snapshot.forEach((doc) => {
                    const data = doc.data();
                    if (data.text) {
                        const msgElement = document.createElement('div');
                        msgElement.classList.add('message');
                        // Zeigt nur den Namen vor dem @ der E-Mail an
                        const username = data.sender ? data.sender.split('@')[0] : 'Unbekannt';
                        msgElement.innerHTML = `<span class="sender">${username}:</span> ${data.text}`;
                        chatBox.appendChild(msgElement);
                    }
                });
                chatBox.scrollTop = chatBox.scrollHeight;
            });
        }
    </script>
</body>
</html>
