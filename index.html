<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebChat mit Lobbys</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #131314;
            color: #e3e3e3;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .chat-container {
            width: 100%;
            max-width: 550px;
            background-color: #1e1f20;
            border: 1px solid #333537;
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
        }

        h2, h3 {
            text-align: center;
            font-weight: 500;
            color: #f1f3f4;
            margin-bottom: 16px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 16px;
        }

        input {
            width: 100%;
            padding: 14px 16px;
            background-color: #282a2c;
            border: 1px solid #444746;
            border-radius: 8px;
            color: #ffffff;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s ease;
        }

        input:focus {
            border-color: #a8c7fa;
        }

        input::placeholder {
            color: #8e918f;
        }

        button {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: none;
            background-color: #0b57d0;
            color: #ffffff;
            font-size: 0.95rem;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        button:hover {
            background-color: #1b66c9;
        }

        .secondary-btn {
            background-color: transparent;
            color: #a8c7fa;
            border: 1px solid #444746;
        }

        .secondary-btn:hover {
            background-color: #282a2c;
        }

        .toggle-text {
            text-align: center;
            margin-top: 14px;
            font-size: 0.85rem;
            color: #c4c7c5;
        }

        .toggle-link {
            color: #a8c7fa;
            cursor: pointer;
            text-decoration: underline;
        }

        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #282a2c;
            padding: 10px 14px;
            border-radius: 8px;
            margin-bottom: 16px;
            font-size: 0.9rem;
            color: #c4c7c5;
        }

        .header-bar span {
            color: #a8c7fa;
            font-weight: 500;
        }

        /* LOBBY LISTE */
        .lobby-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 250px;
            overflow-y: auto;
            margin-bottom: 20px;
        }

        .lobby-card {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #282a2c;
            padding: 14px;
            border-radius: 8px;
            border: 1px solid #444746;
        }

        .lobby-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .badge {
            background-color: #ff4d4d;
            color: white;
            font-size: 0.75rem;
            font-weight: bold;
            padding: 2px 8px;
            border-radius: 12px;
        }

        .lobby-card button {
            width: auto;
            padding: 8px 16px;
        }

        /* CHAT */
        #messages {
            height: 350px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding-right: 6px;
            margin-bottom: 16px;
        }

        .message {
            background-color: #282a2c;
            padding: 10px 14px;
            border-radius: 12px;
            max-width: 85%;
            word-wrap: break-word;
            align-self: flex-start;
            border-bottom-left-radius: 2px;
        }

        .message.own {
            align-self: flex-end;
            background-color: #004a77;
            border-bottom-left-radius: 12px;
            border-bottom-right-radius: 2px;
        }

        .message .username {
            font-size: 0.75rem;
            color: #a8c7fa;
            margin-bottom: 4px;
            display: block;
        }

        .chat-controls {
            display: flex;
            gap: 10px;
        }

        .chat-controls input {
            margin: 0;
        }

        .chat-controls button {
            width: auto;
            padding: 0 20px;
        }

        /* Bereichs-Steuerung */
        #auth-section, #lobby-section, #chat-section, #admin-create-lobby {
            display: none;
        }
    </style>
</head>
<body>

<div class="chat-container">
    <h2>WebChat</h2>

    <!-- AUTHENTIFIZIERUNG -->
    <div id="auth-section">
        <div class="input-group">
            <input type="text" id="username" placeholder="Benutzername (Chat-Name)">
            <input type="email" id="email" placeholder="E-Mail-Adresse">
            <input type="password" id="password" placeholder="Passwort (mind. 6 Zeichen)">
        </div>
        <button id="btn-auth">Einloggen</button>
        <div class="toggle-text">
            <span id="toggle-prompt">Noch kein Konto?</span> 
            <span id="toggle-action" class="toggle-link">Jetzt registrieren</span>
        </div>
    </div>

    <!-- LOBBY AUSWAHL -->
    <div id="lobby-section">
        <div class="header-bar">
            <div>Angemeldet als: <span id="user-display"></span></div>
            <button id="btn-logout" class="secondary-btn" style="width: auto; padding: 4px 10px; margin: 0; font-size: 0.8rem;">Abmelden</button>
        </div>

        <h3>Verfügbare Lobbys</h3>
        <div id="lobby-list" class="lobby-list"></div>

        <!-- Erstellen nur für Admin sichtbar -->
        <div id="admin-create-lobby" style="margin-top: 20px; border-top: 1px solid #444746; padding-top: 16px;">
            <h3>Neue Lobby erstellen (Admin)</h3>
            <div class="input-group">
                <input type="text" id="new-lobby-name" placeholder="Lobby Name">
                <input type="password" id="new-lobby-password" placeholder="Lobby Passwort">
            </div>
            <button id="btn-create-lobby">Lobby Erstellen</button>
        </div>
    </div>

    <!-- CHAT BEREICH -->
    <div id="chat-section">
        <div class="header-bar">
            <div>Lobby: <span id="current-lobby-display"></span></div>
            <button id="btn-leave-lobby" class="secondary-btn" style="width: auto; padding: 4px 10px; margin: 0; font-size: 0.8rem;">Zurück zu Lobbys</button>
        </div>
        
        <div id="messages"></div>

        <div class="chat-controls">
            <input type="text" id="message-input" placeholder="Nachricht schreiben...">
            <button id="btn-send">Senden</button>
        </div>
    </div>
</div>

<!-- FIREBASE SKRIPT -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { 
        getAuth, 
        createUserWithEmailAndPassword, 
        signInWithEmailAndPassword, 
        updateProfile,
        onAuthStateChanged, 
        signOut 
    } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { 
        getFirestore, 
        collection, 
        addDoc, 
        doc,
        setDoc,
        query, 
        orderBy, 
        onSnapshot, 
        serverTimestamp 
    } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    // KOPERE DEINE FIREBASE-UID AUS DEM FIREBASE-DASHBOARD HIER HINEIN:
    const ADMIN_UID = "HIER_DEINE_FIREBASE_UID_EINFUEGEN"; 

    const firebaseConfig = {
      apiKey: "AIzaSyD5funl7uYInXXMBGpqmjp0O7c0tqhBNw0",
      authDomain: "webchat-1c480.firebaseapp.com",
      projectId: "webchat-1c480",
      storageBucket: "webchat-1c480.firebasestorage.app",
      messagingSenderId: "149320504905",
      appId: "1:149320504905:web:501f24bdf3846d32b15198",
      measurementId: "G-LN66CN39SJ"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let isRegisterMode = false;
    let currentLobbyId = null;
    let unsubscribeMessages = null;

    // DOM Elemente
    const authSection = document.getElementById('auth-section');
    const lobbySection = document.getElementById('lobby-section');
    const chatSection = document.getElementById('chat-section');
    const usernameInput = document.getElementById('username');
    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password');
    const btnAuth = document.getElementById('btn-auth');
    const togglePrompt = document.getElementById('toggle-prompt');
    const toggleAction = document.getElementById('toggle-action');
    const userDisplay = document.getElementById('user-display');
    const adminCreateLobby = document.getElementById('admin-create-lobby');
    const lobbyListDiv = document.getElementById('lobby-list');
    const currentLobbyDisplay = document.getElementById('current-lobby-display');
    const messagesDiv = document.getElementById('messages');
    const messageInput = document.getElementById('message-input');

    usernameInput.style.display = "none";

    // Modus Umschalten (Login / Registrieren)
    toggleAction.addEventListener('click', () => {
        isRegisterMode = !isRegisterMode;
        if (isRegisterMode) {
            usernameInput.style.display = "block";
            btnAuth.textContent = "Konto erstellen";
            togglePrompt.textContent = "Bereits ein Konto?";
            toggleAction.textContent = "Hier einloggen";
        } else {
            usernameInput.style.display = "none";
            btnAuth.textContent = "Einloggen";
            togglePrompt.textContent = "Noch kein Konto?";
            toggleAction.textContent = "Jetzt registrieren";
        }
    });

    // Auth Button
    btnAuth.addEventListener('click', () => {
        const email = emailInput.value.trim();
        const password = passwordInput.value;
        const username = usernameInput.value.trim();

        if (!email || !password) return alert("Bitte E-Mail und Passwort eingeben!");

        if (isRegisterMode) {
            if (!username) return alert("Bitte Benutzernamen eingeben!");
            createUserWithEmailAndPassword(auth, email, password)
                .then((res) => updateProfile(res.user, { displayName: username }))
                .catch((err) => alert("Fehler: " + err.message));
        } else {
            signInWithEmailAndPassword(auth, email, password)
                .catch((err) => alert("Login fehlgeschlagen: " + err.message));
        }
    });

    // Abmelden
    document.getElementById('btn-logout').addEventListener('click', () => signOut(auth));

    // Status Listener
    onAuthStateChanged(auth, (user) => {
        if (user) {
            authSection.style.display = "none";
            lobbySection.style.display = "block";
            chatSection.style.display = "none";
            userDisplay.textContent = user.displayName || user.email;

            // Prüfen ob angemeldeter Nutzer Admin ist via UID
            if (user.uid === ADMIN_UID) {
                adminCreateLobby.style.display = "block";
            } else {
                adminCreateLobby.style.display = "none";
            }

            loadLobbies();
        } else {
            authSection.style.display = "block";
            lobbySection.style.display = "none";
            chatSection.style.display = "none";
        }
    });

    // Lobby Erstellen (Nur Admin)
    document.getElementById('btn-create-lobby').addEventListener('click', async () => {
        const name = document.getElementById('new-lobby-name').value.trim();
        const password = document.getElementById('new-lobby-password').value.trim();

        if (!name || !password) return alert("Bitte Name und Passwort für die Lobby eingeben!");

        try {
            await addDoc(collection(db, "lobbies"), {
                name: name,
                password: password,
                lastMessageTime: serverTimestamp()
            });
            document.getElementById('new-lobby-name').value = "";
            document.getElementById('new-lobby-password').value = "";
            alert("Lobby erfolgreich erstellt!");
        } catch (e) {
            alert("Fehler beim Erstellen: " + e.message);
        }
    });

    // Lobbys Laden & Ungelesen-Status anzeigen
    function loadLobbies() {
        onSnapshot(collection(db, "lobbies"), (snapshot) => {
            lobbyListDiv.innerHTML = "";
            snapshot.forEach((docSnap) => {
                const lobby = docSnap.data();
                const lobbyId = docSnap.id;

                const card = document.createElement('div');
                card.className = 'lobby-card';

                // Prüfen ob neue Nachrichten existieren
                const lastSeen = localStorage.getItem(`lastSeen_${lobbyId}`) || 0;
                const lastMsg = lobby.lastMessageTime ? lobby.lastMessageTime.toMillis() : 0;
                const hasUnread = lastMsg > lastSeen;

                card.innerHTML = `
                    <div class="lobby-info">
                        <strong>${escapeHtml(lobby.name)}</strong>
                        ${hasUnread ? '<span class="badge">Neu!</span>' : ''}
                    </div>
                    <button class="join-btn">Beitreten</button>
                `;

                card.querySelector('.join-btn').addEventListener('click', () => joinLobby(lobbyId, lobby.name, lobby.password));
                lobbyListDiv.appendChild(card);
            });
        });
    }

    // Lobby Beitreten
    function joinLobby(lobbyId, name, correctPassword) {
        const enteredPassword = prompt(`Passwort für Lobby "${name}" eingeben:`);
        if (enteredPassword === correctPassword) {
            currentLobbyId = lobbyId;
            currentLobbyDisplay.textContent = name;
            
            // Verlassen-Zeitpunkt für Badges speichern
            localStorage.setItem(`lastSeen_${lobbyId}`, Date.now());

            lobbySection.style.display = "none";
            chatSection.style.display = "block";

            loadMessages(lobbyId);
        } else if (enteredPassword !== null) {
            alert("Falsches Passwort!");
        }
    }

    // Zurück zu Lobbys
    document.getElementById('btn-leave-lobby').addEventListener('click', () => {
        if (unsubscribeMessages) unsubscribeMessages();
        if (currentLobbyId) {
            localStorage.setItem(`lastSeen_${currentLobbyId}`, Date.now());
        }
        currentLobbyId = null;
        chatSection.style.display = "none";
        lobbySection.style.display = "block";
        loadLobbies();
    });

    // Nachricht Senden
    document.getElementById('btn-send').addEventListener('click', sendMessage);
    messageInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') sendMessage();
    });

    async function sendMessage() {
        const text = messageInput.value.trim();
        if (text !== "" && auth.currentUser && currentLobbyId) {
            try {
                const now = serverTimestamp();

                // Nachricht in Unterkollektion der Lobby speichern
                await addDoc(collection(db, "lobbies", currentLobbyId, "messages"), {
                    text: text,
                    user: auth.currentUser.displayName || auth.currentUser.email,
                    uid: auth.currentUser.uid,
                    timestamp: now
                });

                // Hauptlobby aktualisieren, damit die "Neu!" Anzeige getriggert wird
                await setDoc(doc(db, "lobbies", currentLobbyId), {
                    lastMessageTime: now
                }, { merge: true });

                messageInput.value = "";
                localStorage.setItem(`lastSeen_${currentLobbyId}`, Date.now());
            } catch (e) {
                alert("Fehler beim Senden: " + e.message);
            }
        }
    }

    // Nachrichten der Lobby laden
    function loadMessages(lobbyId) {
        const q = query(collection(db, "lobbies", lobbyId, "messages"), orderBy("timestamp", "asc"));
        unsubscribeMessages = onSnapshot(q, (snapshot) => {
            messagesDiv.innerHTML = "";
            snapshot.forEach((docSnap) => {
                const data = docSnap.data();
                const isOwn = auth.currentUser && data.uid === auth.currentUser.uid;
                
                const msgEl = document.createElement('div');
                msgEl.className = `message ${isOwn ? 'own' : ''}`;
                msgEl.innerHTML = `
                    <span class="username">${escapeHtml(data.user)}</span>
                    <div class="text">${escapeHtml(data.text)}</div>
                `;
                messagesDiv.appendChild(msgEl);
            });
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        });
    }

    function escapeHtml(str) {
        return str ? str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;") : "";
    }
</script>

</body>
</html>
